general {
    lock_cmd = ~/.bin/lockscreen.sh
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({state=true})'
}

listener {
    timeout = 600
    on-timeout = loginctl lock-session
}

# The machine stays awake; there is deliberately no suspend listener.
listener {
    timeout = 610
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({state=false})'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({state=true})'
}
